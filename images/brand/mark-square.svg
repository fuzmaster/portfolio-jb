<!-- Square mark for favicon + social icon.
     Compact version of the waveform→nodes idea: 3 bars + connector + node.
     16×16 viewport, designed to read clearly at favicon size. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="#00FFC8">
  <!-- Three waveform bars at left -->
  <rect x="1" y="6"  width="1.6" height="4" rx="0.8"/>
  <rect x="3" y="4"  width="1.6" height="8" rx="0.8"/>
  <rect x="5" y="6.5" width="1.6" height="3" rx="0.8"/>

  <!-- Connector -->
  <line x1="7.2" y1="8" x2="10.5" y2="8" stroke="#00FFC8" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Terminal node -->
  <circle cx="12.5" cy="8" r="2"/>
</svg>
